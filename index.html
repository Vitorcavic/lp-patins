<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snitap</title>
    <link rel="stylesheet" href="styles/index.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500&family=Montserrat:wght@500&family=Syne:wght@700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="top">
        <a href="#">
            <img src="assets/icons/logo.svg" alt="Logo da Snitap">
        </a>
        <a href="#">
            <img src="assets/icons/bag.svg" alt="Imagem de sacola de compras">
            <span>1</span>
        </a>
    </header>

    <section id="hero">
        <div>
            <h1>
                Snitap, sua vida mais
                <div>
                    <span>radical</span>
                    <span>divertida</span>
                    <span>saudável</span>
                    <span>radical</span>
                </div>
            </h1>
            <div class="buttons">
                <a href="#" class="btn buy shadow">
                    <img src="assets/icons/bag.svg" alt="Icone de sacola de compras">
                    Comprar agora
                </a>
                <a href="#" class="btn play">
                    <span class="shadow">
                        <img src="assets/icons/play.svg" alt="Icone de botao de play">
                    </span>
                    Veja em ação
                </a>
            </div>
        </div>
        <div>
            <div class="content">
                <img src="assets/hero/ellipse.svg" alt="">
                <img src="assets/hero/patins-image.png" alt="">
                <img src="assets/hero/stars-1.svg" alt="">
                <img src="assets/hero/stars-2.svg" alt="">
            </div>
        </div>
    </section>
    <section class="banner">
        <div class="scroller bg-gradient">
            <div class="rolling">
                <img src="assets/images/banner.svg" alt="">
                <img src="assets/images/banner.svg" alt="">
                <img src="assets/images/banner.svg" alt="">
                <img src="assets/images/banner.svg" alt="">
                <img src="assets/images/banner.svg" alt="">
                <img src="assets/images/banner.svg" alt="">
                <img src="assets/images/banner.svg" alt="">

                <img src="assets/images/banner.svg" alt="">
                <img src="assets/images/banner.svg" alt="">
                <img src="assets/images/banner.svg" alt="">
                <img src="assets/images/banner.svg" alt="">
                <img src="assets/images/banner.svg" alt="">
                <img src="assets/images/banner.svg" alt="">
                <img src="assets/images/banner.svg" alt="">
                <img src="assets/images/banner.svg" alt="">
                <img src="assets/images/banner.svg" alt="">
                <img src="assets/images/banner.svg" alt="">
                <img src="assets/images/banner.svg" alt="">
                <img src="assets/images/banner.svg" alt="">
                <img src="assets/images/banner.svg" alt="">
                <img src="assets/images/banner.svg" alt="">
                <img src="assets/images/banner.svg" alt="">
                <img src="assets/images/banner.svg" alt="">
            </div>
        </div>
    </section>

    <section class="gallery">
        <header>
            <span>Galeria de fotos</span>
            <h2>#usesnitap por aí</h2>
        </header>
        <div class="content">
            <figure>
                <img src="assets/images/image 01.png" alt="">
                <figcaption>
                    <img src="assets/images/avatar.svg" alt="">
                    <span>@laviniapereira</span>
                </figcaption>
            </figure>
            <figure data-delay>
                <img src="assets/images/image 02.png" alt="">
                <figcaption>
                    <img src="assets/images/avatar.svg" alt="">
                    <span>@laviniapereira</span>
                </figcaption>
            </figure>
            <figure>
                <img src="assets/images/image 03.png" alt="">
                <figcaption>
                    <img src="assets/images/avatar.svg" alt="">
                    <span>@laviniapereira</span>
                </figcaption>
            </figure>
            <figure data-delay>
                <img src="assets/images/image 04.png" alt="">
                <figcaption>
                    <img src="assets/images/avatar.svg" alt="">
                    <span>@laviniapereira</span>
                </figcaption>
            </figure>
        </div>
    </section>

</html>
